name: Publish validated preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.6.0-rc1)
        required: true
        type: string
      run_id:
        description: Successful Build and validate run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      VALIDATED_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify completed validation and download its exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATED_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          gh api "repos/$GH_REPO/actions/runs/$VALIDATED_RUN" > run.json
          jq -e '.status == "completed" and .conclusion == "success" and .path == ".github/workflows/build.yml" and .head_branch == "main"' run.json
          build_commit=$(jq -r .head_sha run.json)
          git fetch --depth=1 origin tag "$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$build_commit"
          gh run download "$VALIDATED_RUN" --name EmotionalParticle-Windows --name EmotionalParticle-macOS --dir release-assets
          for platform in Windows macOS; do
            files=(release-assets/"EmotionalParticle-$platform"/EmotionalParticle-*.zip)
            [[ ${#files[@]} -eq 1 && -s "${files[0]}" ]]
          done
      - name: Publish preview with stable download URLs
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets/EmotionalParticle-Windows && sha256sum *.zip) > release-assets/SHA256SUMS.txt
          (cd release-assets/EmotionalParticle-macOS && sha256sum *.zip) >> release-assets/SHA256SUMS.txt
          # Maintainer creates the release first; automation only uploads validated assets.
          gh release view "$RELEASE_TAG" > /dev/null
          gh release upload "$RELEASE_TAG" \
            release-assets/EmotionalParticle-Windows/*.zip \
            release-assets/EmotionalParticle-macOS/*.zip release-assets/SHA256SUMS.txt
